{#-
  The footer of every page: the wiki's name with a short disclaimer.
  Replaces the theme's copyright partial, so "Made with Zensical" is gone.
-#}
<div class="md-copyright mp-foot">
  <div class="mp-foot__brand">
    <img class="mp-foot__logo" src="{{ config.theme.logo | url }}" alt="" width="40" height="40">
    <div class="mp-foot__about">
      <b class="mp-foot__name">{{ config.site_name }}</b>
      <span class="mp-foot__note">{{ config.copyright }}</span>
    </div>
  </div>
</div>
