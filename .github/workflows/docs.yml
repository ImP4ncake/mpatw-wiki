name: Publish wiki

on:
  # Every change to the wiki
  push:
    branches:
      - main
  # Refresh live game data and official Discord updates every hour
  schedule:
    - cron: "17 * * * *"
  # Manual run from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50  # enough history for the "Recent Changes" page
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      # The Zensical version is pinned in requirements.txt so an update
      # can never break the site by surprise. Change it there to upgrade.
      - run: pip install -r requirements.txt

      # Download fresh data from the official Roblox APIs and new
      # announcements from Discord. If something can't be reached, the
      # script keeps the last saved data and never fails.
      - name: Update game data
        id: data
        run: python scripts/update_data.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}

      # Save new announcements right away (their images expire on Discord),
      # and one data point per day for the history chart.
      - name: Save data
        if: steps.data.outputs.discord_changed == 'true' || (steps.data.outputs.new_day == 'true' && github.event_name != 'push')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data includes/generated docs/assets/updates 2>/dev/null || git add data includes/generated
          git commit -m "Update game data ($(date -u +%F))" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
