name: Publish wiki

on:
  # Every change to the wiki
  push:
    branches:
      - main
  # Refresh live game data (stats, badges, gamepasses) every 6 hours
  schedule:
    - cron: "17 */6 * * *"
  # Manual run from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      # The Zensical version is pinned in requirements.txt so an update
      # can never break the site by surprise. Change it there to upgrade.
      - run: pip install -r requirements.txt

      # Download fresh data from the official Roblox APIs. If Roblox can't be
      # reached, the script keeps the last saved data and never fails.
      - name: Update game data
        id: data
        run: python scripts/update_data.py

      # Once a day, save the new data point in the repository so the
      # history chart keeps growing.
      - name: Save daily data
        if: steps.data.outputs.new_day == 'true' && github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data includes/generated
          git commit -m "Update game data ($(date -u +%F))" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
