# Change ?v= whenever you edit game.css or game.js, so browsers load the new
# version right away instead of a copy saved up to 10 minutes earlier.
extra_css = ["assets/stylesheets/fonts.css", "assets/stylesheets/game.css?v=20261013-16", "assets/stylesheets/rulebook.css?v=20261013-9"]
extra_javascript = ["assets/javascripts/game.js?v=20261013-2", "assets/javascripts/rulebook.js?v=20261013-5"]

[project.theme]
language = "en"
# overrides/partials/copyright.html replaces the footer text
custom_dir = "overrides"
features = [
  "announce.dismiss",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

logo = "assets/images/logo.svg"
favicon = "assets/images/logo.svg"
# Fonts are bundled in docs/assets/fonts (see assets/stylesheets/fonts.css)
font = false


[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = ["includes"]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
