[project]
site_url = "https://imp4ncake.github.io/mpatw-wiki/"
site_name = "MPATW Wiki"
site_description = "Unofficial fan wiki for the Roblox game Meet People Across The World: guides, badges, gamepasses, codes and more."
site_author = "MPATW Wiki contributors"

copyright = "Unofficial fan wiki, not affiliated with or endorsed by Roblox Corporation or Nogo. Wiki text is available under CC BY-SA 4.0."

repo_url = "https://github.com/ImP4ncake/mpatw-wiki"
repo_name = "ImP4ncake/mpatw-wiki"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Features" = [
    { "Profiles and countries" = "features/profiles-and-countries.md" },
    { "Reputation and comments" = "features/reputation-and-comments.md" },
    { "Servers" = "features/servers.md" },
    { "Activities" = "features/activities.md" },
    { "Seasonal events" = "features/events.md" },
  ] },
  { "Economy" = [
    { "Currencies" = "economy/currencies.md" },
    { "Codes" = "economy/codes.md" },
    { "Gamepasses" = "economy/gamepasses.md" },
  ] },
  { "Badges" = "badges.md" },
  { "Standard vs 18+ version" = "versions.md" },
  { "FAQ" = "faq.md" },
  { "Wiki" = [
    { "How to contribute" = "contributing.md" },
    { "Wiki updates" = "updates.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/globe"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
