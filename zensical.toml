[project]
site_url = "https://imp4ncake.github.io/mpatw-wiki/"
site_name = "MPATW Wiki"
site_description = "Unofficial fan wiki for the Roblox game Meet People Across The World: guides, badges, gamepasses, codes and more."
site_author = "MPATW Wiki contributors"

copyright = "Unofficial fan wiki, not affiliated with or endorsed by Roblox Corporation or Nogo. Wiki text is available under CC BY-SA 4.0."

repo_url = "https://github.com/ImP4ncake/mpatw-wiki"
repo_name = "ImP4ncake/mpatw-wiki"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Wiki sections" = [
    { "Country" = "sections/country.md" },
    { "Items" = "sections/items.md" },
    { "Troll" = "sections/troll.md" },
    { "Titles" = "sections/titles.md" },
    { "Banners" = "sections/banners.md" },
    { "Tip Jars" = "sections/tip-jars.md" },
    { "Locations" = "sections/locations.md" },
    { "Meet People Legends" = "sections/legends.md" },
  ] },
  { "Game guide" = [
    { "Profiles and reputation" = "features/reputation-and-comments.md" },
    { "Servers" = "features/servers.md" },
    { "Activities" = "features/activities.md" },
    { "Seasonal events" = "features/events.md" },
    { "Standard vs 18+ version" = "versions.md" },
  ] },
  { "Economy" = [
    { "Coins and currencies" = "economy/currencies.md" },
    { "Codes" = "economy/codes.md" },
    { "Gamepasses" = "economy/gamepasses.md" },
  ] },
  { "Badges" = "badges.md" },
  { "Game stats" = "stats.md" },
  { "Help" = [
    { "FAQ" = "faq.md" },
    { "How to contribute" = "contributing.md" },
    { "Wiki updates" = "updates.md" },
  ] },
]

extra_css = ["assets/stylesheets/game.css"]
extra_javascript = ["assets/javascripts/game.js"]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

logo = "assets/images/logo.svg"
favicon = "assets/images/logo.svg"

[project.theme.font]
text = "Nunito"
code = "JetBrains Mono"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = ["includes"]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
